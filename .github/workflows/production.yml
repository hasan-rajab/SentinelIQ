name: Production image
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build complete web application
        run: docker build -f ops/production.Dockerfile -t sentineliq-production:ci .
      - name: Test production startup and authentication
        run: python ops/smoke.py
