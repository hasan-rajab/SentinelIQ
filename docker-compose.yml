services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentineliq
      POSTGRES_USER: sentineliq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentineliq-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineliq -d sentineliq"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - sentineliq-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - sentineliq-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - sentineliq-net

  backend:
    image: sentineliq-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentineliq-backend
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONUNBUFFERED: "1"
      SENTINELIQ_CORS_ORIGINS: ${SENTINELIQ_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SENTINELIQ_DATABASE_URL: postgresql+psycopg://sentineliq:${POSTGRES_PASSWORD:-sentineliq-local}@postgres:5432/sentineliq
      SENTINELIQ_INGEST_API_KEY: ${SENTINELIQ_INGEST_API_KEY:-sentineliq-local-ingest}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./ml/saved_models:/app/ml/saved_models:ro
      - ./data:/app/data
      - ./configs:/app/configs:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - sentineliq-net

  kafka-consumer:
    image: sentineliq-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "ingestion.kafka_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SENTINELIQ_INGEST_URL: http://backend:8000/ingest
      SENTINELIQ_INGEST_API_KEY: ${SENTINELIQ_INGEST_API_KEY:-sentineliq-local-ingest}
      KAFKA_CONSUMER_GROUP: sentineliq-inference-v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentineliq-net

  demo-producer:
    image: sentineliq-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "ingestion.kafka_producer"]
    profiles: ["demo"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SENTINELIQ_DEMO_INTERVAL_SECONDS: ${SENTINELIQ_DEMO_INTERVAL_SECONDS:-0.5}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentineliq-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: sentineliq-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentineliq-net

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentineliq-net

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sentineliq-net

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  sentineliq-net:
    driver: bridge
